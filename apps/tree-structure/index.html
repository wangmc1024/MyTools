<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树结构全品类可视化教学平台</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/portal-nav.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Portal Navbar -->
<div id="portalNavbar">
  <a href="../../index.html">← Gizmo Galaxy</a>
  <span>|</span>
  <span class="nav-title">🌳 树结构全品类可视化教学平台</span>
  <div style="flex:1"></div>
  <button id="portalThemeToggle" onclick="toggleTheme()" title="切换主题">
    <span id="themeIcon"></span>
  </button>
</div>

<!-- Main Layout -->
<div class="main-wrapper">

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-group">
      <span class="status-label">结构</span>
      <span class="status-value" id="statusName">普通二叉树</span>
    </div>
    <div class="status-sep"></div>
    <div class="status-group">
      <span class="status-label">节点数</span>
      <span class="status-value" id="statusNodes">0</span>
    </div>
    <div class="status-sep"></div>
    <div class="status-group">
      <span class="status-label">高度</span>
      <span class="status-value" id="statusHeight">0</span>
    </div>
    <div class="status-sep"></div>
    <div class="status-group">
      <span class="status-label">合法性</span>
      <span class="status-value" id="statusValid">—</span>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-type="binary">普通二叉树</button>
    <button class="tab-btn" data-type="perfect">满二叉树</button>
    <button class="tab-btn" data-type="complete">完全二叉树</button>
    <button class="tab-btn" data-type="threaded">线索二叉树</button>
    <button class="tab-btn" data-type="bst">BST</button>
    <button class="tab-btn" data-type="heap">二叉堆</button>
    <button class="tab-btn" data-type="avl">AVL</button>
    <button class="tab-btn" data-type="rbtree">红黑树</button>
    <button class="tab-btn" data-type="btree">B树</button>
    <button class="tab-btn" data-type="bplustree">B+树</button>
    <button class="tab-btn" data-type="bstar">B*树</button>
    <button class="tab-btn" data-type="forest">森林</button>
    <button class="tab-btn" data-type="disjoint">并查集</button>
  </div>

  <!-- Content Area -->
  <div class="content-area">

    <!-- ===== Unified Left Control Panel ===== -->
    <div class="left-panel" id="leftPanel">
      <div class="panel-frame">

        <!-- Panel Header -->
        <div class="panel-header">
          <span class="panel-icon">⚙</span>
          <span class="panel-title">控制面板</span>
          <div class="panel-tabs">
            <button class="ptab active" data-sec="build">输入</button>
            <button class="ptab" data-sec="anim">动画</button>
            <button class="ptab" data-sec="tools">工具</button>
          </div>
          <button id="btnCollapseLeft" class="panel-collapse-btn" title="收起面板">◀</button>
        </div>

        <!-- Panel Body -->
        <div class="panel-body">

          <!-- Section: Build -->
          <div class="sec active" id="sec-build">
            <div class="sec-head">
              <span>▶ 数据构建</span>
            </div>
            <div class="sec-body">
              <label class="fld-label">输入序列（逗号分隔）</label>
              <textarea id="inputSeq" placeholder="例: 50,30,70,20,40,60,80" spellcheck="false"></textarea>

              <div class="btn-row">
                <button id="btnBuild" class="btn btn-primary">▶ 构建</button>
                <button id="btnBuildAppend" class="btn btn-secondary">⊕ 追加</button>
                <button id="btnRandom" class="btn btn-secondary">🎲 随机</button>
                <button id="btnClear" class="btn btn-danger">清空</button>
              </div>

              <div class="slider-row">
                <label class="slider-label">
                  节点数 <input type="range" id="randomCount" min="3" max="20" value="10"> <span id="randomCountVal">10</span>
                </label>
                <label class="slider-label">
                  最大值 <input type="range" id="randomMax" min="10" max="200" value="100"> <span id="randomMaxVal">100</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Section: Animation + Traverse -->
          <div class="sec" id="sec-anim">
            <div class="sec-head">
              <span>◈ 遍历 &amp; 动画</span>
            </div>
            <div class="sec-body">
              <label class="fld-label">遍历模式</label>
              <div class="btn-row">
                <button class="btn btn-traverse" data-traverse="pre">前序</button>
                <button class="btn btn-traverse" data-traverse="in">中序</button>
                <button class="btn btn-traverse" data-traverse="post">后序</button>
                <button class="btn btn-traverse" data-traverse="level">层序</button>
              </div>
              <div style="height:8px"></div>
              <label class="fld-label">动画控制</label>
              <div class="btn-row">
                <button id="btnPlay" class="btn btn-accent">▶ 播放</button>
                <button id="btnPause" class="btn btn-secondary">⏸</button>
                <button id="btnStep" class="btn btn-secondary">⏭ 单步</button>
                <button id="btnReset" class="btn btn-secondary">↺ 重置</button>
              </div>
              <div class="speed-row">
                <label class="slider-label">
                  速度 <span id="speedVal">1.0x</span>
                  <input type="range" id="animSpeed" min="1" max="10" value="5">
                </label>
              </div>
            </div>
          </div>

          <!-- Section: Tools (type-specific) -->
          <div class="sec" id="sec-tools">
            <div class="sec-head">
              <span>⚡ 专属操作</span>
            </div>
            <div class="sec-body" id="specificBody"></div>
          </div>

        </div><!-- /panel-body -->
      </div><!-- /panel-frame -->
    </div><!-- /left-panel -->

    <!-- Center: SVG Canvas -->
    <div class="canvas-area">
      <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-text-muted)"/>
          </marker>
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-strong">
            <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="canvasGroup">
          <g id="edgesLayer"></g>
          <g id="threadsLayer"></g>
          <g id="nodesLayer"></g>
          <g id="labelsLayer"></g>
          <g id="tooltipLayer"></g>
        </g>
      </svg>
      <div class="canvas-toolbar">
        <button id="btnCanvasZoomIn" class="btn-canvas-tool" title="放大">+</button>
        <button id="btnCanvasZoomOut" class="btn-canvas-tool" title="缩小">−</button>
        <button id="btnCanvasReset" class="btn-canvas-tool" title="重置视图">⟲</button>
        <button id="btnCanvasFullscreen" class="btn-canvas-tool" title="全屏">⛶</button>
      </div>
      <div class="canvas-hint">滚轮缩放 · 拖拽平移 · 拖动节点=移动节点 · Shift+拖动=移动整树 · 双击=编辑 · 点击=选中</div>
    </div>

    <!-- 非模态浮动弹窗（编辑节点 / 输入值） -->
    <div id="floatingDialog" class="fd-dialog" hidden>
      <div class="fd-header" id="fdHeader">
        <span class="fd-title" id="fdTitle">编辑节点</span>
        <button class="fd-close" id="fdClose" title="关闭">×</button>
      </div>
      <div class="fd-body">
        <label class="fd-label" id="fdLabel">新数值</label>
        <input type="number" class="fd-input" id="fdInput" autocomplete="off">
        <div class="fd-hint" id="fdHint"></div>
      </div>
      <div class="fd-actions">
        <button class="btn btn-secondary" id="fdCancel">取消</button>
        <button class="btn btn-accent" id="fdConfirm">确定</button>
      </div>
    </div>

    <!-- Right Panel: Knowledge -->
    <div class="info-panel">
      <div class="info-panel-head">
        <span class="panel-icon">?</span>
        <span>知识点面板</span>
        <button id="btnCollapseInfo" class="panel-collapse-btn" title="收起面板">▶</button>
      </div>
      <div id="infoContent">
        <div class="info-block">
          <h4>结构定义</h4>
          <p id="infoDef">—</p>
        </div>
        <div class="info-block">
          <h4>核心性质</h4>
          <ul id="infoProps"></ul>
        </div>
        <div class="info-block">
          <h4>408 高频考点</h4>
          <ul id="infoExam"></ul>
        </div>
        <div class="info-block">
          <h4>时间复杂度</h4>
          <table id="infoComplexity">
            <thead><tr><th>操作</th><th>查找</th><th>插入</th><th>删除</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="info-block">
          <h4>易错点</h4>
          <p id="infoMistakes">—</p>
        </div>
        <div class="info-block info-block-validation">
          <h4>结构校验</h4>
          <div id="infoValidation"></div>
        </div>
      </div>
    </div>

  </div><!-- /content-area -->

  <!-- Log Console -->
  <div class="log-panel">
    <div class="log-header">
      <span class="log-title">
        <span class="log-dot"></span>
        算法步骤日志
      </span>
      <div style="display:flex;gap:4px;align-items:center;">
        <button id="btnCollapseLog" class="panel-collapse-btn" title="收起日志">▼</button>
        <button id="btnClearLog" class="btn-log-clear">清空</button>
      </div>
    </div>
    <div id="logConsole" class="log-console"></div>
  </div>

</div><!-- /main-wrapper -->

<script src="../../assets/js/tools.js"></script>
<script src="app.js"></script>
</body>
</html>
