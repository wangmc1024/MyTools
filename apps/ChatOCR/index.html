<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatOCR · 对话式多模态工作台</title>
  <meta name="description" content="对话式 OCR 多模态工作台：智能路由分发 OCR 识别、内容问答、图像/视频生成与联网搜索。" />

  <!-- Fonts: Spectral (display serif) + Inter (UI grotesque) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <!-- markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- Portal navbar (repo convention) -->
  <div id="portalNavbar">
    <a href="../../index.html">← MyTools</a>
    <span>|</span>
    <span class="ptitle">ChatOCR</span>
    <div style="flex:1"></div>
    <button id="portalThemeToggle" title="切换主题"><span id="portalThemeIcon">☀️</span></button>
  </div>

  <div class="app">
    <!-- Hero — the thesis: one input, system decides the engine -->
    <section class="hero">
      <div class="hero-mark">OCR · 创意工作室</div>
      <h1>今天想<em>读</em>点什么，还是<em>做</em>点什么？</h1>
      <p class="hero-sub">上传图片我来识别文字，或直接说你的需求 —— 系统会自动路由到最合适的模型。</p>
    </section>

    <!-- Composer -->
    <div class="composer-wrap">
      <div id="attachRow" class="attach-row"></div>
      <div id="composer" class="composer">
        <textarea id="composerInput" rows="1" placeholder="上传图片识别文字，或说「画一张…」「做个…视频」「今天A股多少点」"></textarea>
        <div class="composer-actions">
          <button id="fileBtn" class="icon-btn" title="上传图片/PDF" aria-label="上传文件">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
          </button>
          <button id="sendBtn" class="send-btn" title="发送" aria-label="发送">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
          </button>
        </div>
      </div>
      <input type="file" id="fileInput" class="hidden" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif,application/pdf" style="display:none">

      <!-- Example intents -->
      <div id="intents" class="intents">
        <button class="intent" data-prompt="">📎 上传图片后识别（无需输入）</button>
        <button class="intent" data-prompt="概括一下识别到的内容">💬 概括识别内容</button>
        <button class="intent" data-prompt="画一张赛博朋克城市，霓虹雨夜">🎨 画赛博朋克城市</button>
        <button class="intent" data-prompt="做一个5秒的雨滴落在水面的视频，24fps">🎬 做雨滴视频</button>
        <button class="intent" data-prompt="今天A股大盘多少点？">🔍 联网查行情</button>
      </div>
    </div>

    <!-- SIGNATURE: routing ribbon -->
    <div id="ribbon" class="ribbon idle" role="status" aria-live="polite">
      <span class="ribbon-label">路由</span>
      <span class="ribbon-chips"></span>
      <span class="ribbon-progress"></span>
    </div>

    <!-- Control rail -->
    <div class="rail">
      <div class="rail-group">
        <span class="rail-label">格式</span>
        <button class="seg format-seg" data-format="markdown">Markdown</button>
        <button class="seg format-seg" data-format="plain">纯文本</button>
        <button class="seg format-seg" data-format="table">表格</button>
        <button class="seg format-seg" data-format="describe">图解</button>
      </div>
      <div class="rail-group">
        <span class="rail-label">OCR 模型</span>
        <select id="ocrModelSel" class="seg"></select>
      </div>
      <div class="rail-spacer"></div>
      <button id="galleryLink" class="rail-link" onclick="location.href='./gallery.html'">🖼️ 画廊</button>
      <button id="settingsBtn" class="rail-link">⚙️ 设置</button>
      <button id="exportBtn" class="rail-link">⬇️ 导出</button>
      <button id="clearBtn" class="rail-link">🗑️ 清空</button>
    </div>

    <!-- Message stream -->
    <div id="stream" class="stream"></div>
  </div>

  <!-- toast container handled by shared tools.js if present -->
  <script src="../../assets/js/tools.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
