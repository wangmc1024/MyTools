<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2028%2028%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%225%22%20y1=%222%22%20x2=%2223%22%20y2=%2224%22%20gradientUnits=%22userSpaceOnUse%22%3E%3Cstop%20stop-color=%22%23a99fff%22/%3E%3Cstop%20offset=%22.5%22%20stop-color=%22%238b83ff%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23635bff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx=%2214%22%20cy=%2214%22%20r=%2213%22%20fill=%22url(%23g)%22%20opacity=%22.1%22/%3E%3Cpath%20d=%22M14%203l2.2%205.7L22%209.8l-4.6%203.4L18.3%2019%2014%2016.6%209.7%2019l.9-5.8L6%209.8l5.8-1.1L14%203z%22%20fill=%22url(%23g)%22/%3E%3Cpath%20d=%22M14%205.2l1.7%204.3%204.7.7-3.6%202.9%201.1-4.5-3.6-2.9%204.7-.7L14%205.2z%22%20fill=%22%23fff%22%20opacity=%22.18%22/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/img/apple-touch-icon.png">
  <title>404 — Gizmo Galaxy</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/portal-nav.css">
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#635bff',
            primaryLight: '#7f74ff',
          },
          fontFamily: {
            sans: ['Inter', 'Segoe UI', '-apple-system', 'BlinkMacSystemFont', 'Helvetica Neue', 'Noto Sans SC', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    /* ---- Theme variables now in tokens.css ---- */
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Noto Sans SC', sans-serif;
      transition: background .3s, color .3s;
      min-height: 100vh; overflow-x: hidden;
    }
    ::selection { background: rgba(99,91,255,.3); }

    /* ---- Glass Navbar (matches index.html) ---- */
    .nav-glass {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      background: rgba(17,24,39,.72) !important;
      border-bottom: 1px solid var(--border);
    }
    [data-theme="light"] .nav-glass { background: rgba(255,255,255,.72) !important; }
    .nav-link {
      color: rgba(255,255,255,.7); transition: all .2s;
    }
    [data-theme="light"] .nav-link { color: rgba(0,0,0,.6); }
    .nav-link:hover { background: var(--bg-card-hover); }
    .theme-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer; transition: all .2s; flex-shrink: 0;
      line-height: 1; color: var(--text);
    }
    .theme-btn:hover { background: var(--bg-card-hover); transform: scale(1.05); }

    /* ---- Starfield canvas (matches index.html constellation) ---- */
    #starfield {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    /* ---- Scene ---- */
    .scene {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: calc(100vh - 60px); padding: 40px 20px;
    }

    /* ---- Astronaut Illustration (pure CSS/SVG) ---- */
    .astronaut-wrap {
      position: relative; width: 180px; height: 180px; margin-bottom: 12px;
      animation: astroFloat 6s ease-in-out infinite;
    }
    @keyframes astroFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(2deg); }
      50% { transform: translateY(-6px) rotate(-1deg); }
      75% { transform: translateY(-14px) rotate(1.5deg); }
    }
    .astronaut-body {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* ---- Orbit ring ---- */
    .orbit-ring {
      position: absolute;
      width: 220px; height: 220px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 1.5px dashed rgba(99,91,255,.2);
      border-radius: 50%;
      animation: orbitSpin 20s linear infinite;
    }
    .orbit-dot {
      position: absolute; width: 8px; height: 8px;
      background: #635bff; border-radius: 50%;
      box-shadow: 0 0 12px rgba(99,91,255,.6);
      top: -4px; left: 50%; transform: translateX(-50%);
    }
    @keyframes orbitSpin { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }

    /* ---- Error Code ---- */
    .error-code {
      font-size: clamp(72px, 14vw, 160px);
      font-weight: 900; letter-spacing: -4px; line-height: 1;
      margin: 0 0 12px;
      background: linear-gradient(135deg, #6366f1, #ec4899, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; background-size: 200% 200%;
      animation: gradShift 5s ease-in-out infinite;
      user-select: none;
    }
    @keyframes gradShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ---- Subtitle ---- */
    .subtitle {
      font-size: 20px; font-weight: 600; color: var(--text);
      margin-bottom: 6px; text-align: center;
    }
    .desc {
      font-size: 15px; color: var(--text-muted);
      text-align: center; max-width: 440px; line-height: 1.7;
      margin-bottom: 36px;
    }

    /* ---- Glass Card (suggestions) ---- */
    .suggestions {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      max-width: 640px; width: 100%; margin-bottom: 36px;
    }
    .sug-card {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 22px 16px; border-radius: 16px;
      background: var(--bg-card); border: 1px solid var(--border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      text-decoration: none; color: var(--text);
      transition: all .3s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
    }
    .sug-card:hover {
      border-color: #635bff; transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(99,91,255,.18);
      background: var(--bg-card-hover);
    }
    .sug-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(99,91,255,.1); color: #818cf8;
      transition: all .3s;
    }
    .sug-card:hover .sug-icon {
      background: rgba(99,91,255,.2); transform: scale(1.1);
    }
    .sug-label { font-size: 14px; font-weight: 600; }
    .sug-desc { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.4; }

    /* ---- Action Buttons ---- */
    .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 12px;
      font-weight: 600; font-size: 15px; text-decoration: none;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff; box-shadow: 0 4px 16px rgba(99,102,241,.3);
      transition: all .25s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(99,102,241,.45);
    }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 12px;
      font-weight: 600; font-size: 15px; text-decoration: none;
      background: var(--bg-card); color: var(--text);
      border: 1px solid var(--border);
      transition: all .25s ease;
    }
    .btn-ghost:hover {
      background: var(--bg-card-hover); transform: translateY(-2px);
    }

    /* ---- Floating elements ---- */
    .float-decor {
      position: absolute; pointer-events: none; z-index: 0; opacity: .4;
    }

    /* ---- Entrance animations ---- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim { animation: fadeInUp .7s ease-out both; }
    .anim-d1 { animation-delay: .08s; }
    .anim-d2 { animation-delay: .18s; }
    .anim-d3 { animation-delay: .30s; }
    .anim-d4 { animation-delay: .44s; }
    .anim-d5 { animation-delay: .58s; }

    /* ---- Responsive ---- */
    @media (max-width: 640px) {
      .suggestions { grid-template-columns: 1fr; max-width: 300px; }
      .astronaut-wrap { width: 140px; height: 140px; }
      .orbit-ring { width: 180px; height: 180px; }
      .desc { padding: 0 12px; }
    }
    @media (min-width: 641px) and (max-width: 768px) {
      .suggestions { grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .sug-card { padding: 18px 12px; }
    }
  </style>
</head>

  <!-- ===== Scripts ===== -->
  <script>
    /* ---- Theme Toggle ---- */
    (function() {
      var btn = document.getElementById('themeToggle');
      var html = document.documentElement;
      var saved = localStorage.getItem('portal-theme');
      if (saved) html.setAttribute('data-theme', saved);
      updateBtn();
      btn.addEventListener('click', function() {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('portal-theme', next);
        updateBtn();
      });
      function updateBtn() {
        btn.textContent = html.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
      }
    })();

    /* ---- Starfield (matches index.html constellation style) ---- */
    (function() {
      var c = document.getElementById('starfield');
      var ctx = c.getContext('2d');
      var stars = [];
      var STAR_COUNT = 80;
      var w, h;

      function resize() {
        var dpr = window.devicePixelRatio || 1;
        w = c.offsetWidth; h = c.offsetHeight;
        c.width = w * dpr; c.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      // Create stars
      for (var i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * 2000,
          y: Math.random() * 2000,
          r: Math.random() * 1.8 + 0.3,
          o: Math.random() * 0.6 + 0.15,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinklePhase: Math.random() * Math.PI * 2,
          color: Math.random() > 0.7 ? '#c4b5fd' : '#ffffff',
        });
      }

      // Constellation lines
      var connections = [];
      for (var i = 0; i < 12; i++) {
        var a = Math.floor(Math.random() * STAR_COUNT);
        var b = Math.floor(Math.random() * STAR_COUNT);
        if (a !== b) connections.push([a, b]);
      }

      var t = 0;
      function draw() {
        t += 1;
        ctx.clearRect(0, 0, w, h);

        // Draw connections
        ctx.strokeStyle = 'rgba(99,91,255,0.06)';
        ctx.lineWidth = 1;
        for (var i = 0; i < connections.length; i++) {
          var s1 = stars[connections[i][0]];
          var s2 = stars[connections[i][1]];
          if (s1 && s2) {
            ctx.beginPath();
            ctx.moveTo(s1.x % w, s1.y % h);
            ctx.lineTo(s2.x % w, s2.y % h);
            ctx.stroke();
          }
        }

        // Draw stars
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var twinkle = Math.sin(t * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7;
          var alpha = s.o * twinkle;
          ctx.beginPath();
          ctx.arc(s.x % w, s.y % h, s.r, 0, Math.PI * 2);
          ctx.fillStyle = s.color === '#c4b5fd'
            ? 'rgba(196,181,253,' + alpha + ')'
            : 'rgba(255,255,255,' + alpha + ')';
          ctx.fill();

          // Glow for larger stars
          if (s.r > 1.4) {
            ctx.beginPath();
            ctx.arc(s.x % w, s.y % h, s.r * 3, 0, Math.PI * 2);
            var glow = ctx.createRadialGradient(s.x % w, s.y % h, 0, s.x % w, s.y % h, s.r * 3);
            glow.addColorStop(0, 'rgba(99,102,241,' + (alpha * 0.15) + ')');
            glow.addColorStop(1, 'rgba(99,102,241,0)');
            ctx.fillStyle = glow;
            ctx.fill();
          }
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
